name: Bash Syntax Check

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.bats'
      - '**.yml'
      - '**.yaml'
      
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.bats'
      - '**.yml'
      - '**.yaml'

jobs:
  syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Bash syntax
        run: |
          find . -type f -exec grep -l '^#!/bin/bash' {} \; |
          while read -r file; do
            bash -n "$file" || exit 1
          done

  shell-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   
        
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .

  bats-check:         
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run Bats tests
        run: bats tests/*.bats > test-results.txt 2>&1

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: bats-report
          path: test-results.txt

  report:
      needs: [syntax-check, shell-check, bats-check] 
      runs-on: ubuntu-24.04
      steps:
        - name: Download test report
          uses: actions/download-artifact@v4
          with:
            name: bats-report
        
        - name: Display test report
          run: cat test-results.txt
