name: Bash Syntax Check

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.bats'
      - '**.yml'
      - '**.yaml'
      - '**.yml'
      
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.bats'
      - '**.yml'
      - '**.yaml'
      - '**.yml'
      
jobs:
  syntax-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check Bash syntax
        run: |
          find . -type f -exec grep -l '^#!/bin/bash' {} \; |
          while read -r file; do
            bash -n "$file" || exit 1
          done

  shell-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   
        
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .

  bats-check:         
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        
      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run Bats tests
        run: bats tests/*.bats
